# -- Site Configuration --
# Congo docs: https://jpanther.github.io/congo/docs/getting-started/

baseURL = "https://scottbrinkmeyer.me/"
theme = "congo"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 10

# JSON output is required for Congo's client-side search.
[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.youTube]
    privacyEnhanced = true
